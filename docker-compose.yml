version: "3.9"

services:
  # =========================
  # 🔹 PostgreSQL Database
  # =========================
  postgres:
    image: postgres:16.9-alpine3.22
    container_name: postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # =========================
  # 🔹 PgAdmin Web UI
  # =========================
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: pgadmin_web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - app_network

  # =========================
  # 🔹 Redis Cache
  # =========================
  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app_network

  # =========================
  # 🔹 MinIO Storage
  # =========================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9002:9000" # API port redirigé (évite conflit avec Portainer)
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    networks:
      - app_network

  # =========================
  # 🔹 MinIO Bucket Initializer
  # =========================
  createbuckets:
    image: minio/mc:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...';
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/deliverer-documents;
      /usr/bin/mc anonymous set public myminio/deliverer-documents;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - app_network

# =========================
# 🔸 Volumes & Networks
# =========================
volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge
